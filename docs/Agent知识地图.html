<!doctype html>
<html lang="zh-CN">
<head>

  <title>Agent 知识地图 · 独立探索版</title>
  <style>
    :root { color-scheme:dark; --background:#272934; --foreground:#f2eef4; --muted-foreground:#b8b6c5; --border:#444652;
      --viz-series-1:#ffb0da; --viz-series-2:#73d38e; --viz-series-3:#6e9fff; --viz-series-4:#f69a55; --viz-series-5:#63c3e2; --viz-series-6:#f5d566;

    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--background); color:var(--foreground); }
    main { max-width:1500px; margin:0 auto; padding:28px 30px 36px; }
    h1 { font-size:24px; font-weight:500; margin:0 0 7px; letter-spacing:.02em; }
    .eyebrow { color:var(--muted-foreground); font-size:12px; margin-bottom:9px; letter-spacing:.12em; }
    .map-meta { font-size:13px; color:var(--muted-foreground); margin:0 0 24px; }
    .map-controls { display:flex; flex-wrap:wrap; gap:14px; }
    .map-field { flex:1 1 250px; min-width:0; }
    .form-label { display:block; margin-bottom:7px; color:var(--muted-foreground); font-size:13px; }

    .map-plot { width:100%; margin-top:10px; }

    .map-node { fill:var(--background); stroke:transparent; stroke-width:1; }
    .map-node.selected { stroke:var(--viz-series-1); stroke-width:2.4; }
    .map-edge { fill:none; stroke:#a9a7b2; stroke-opacity:.50; stroke-width:1.05; }
    .map-edge.active { stroke:var(--viz-series-1); stroke-opacity:1; stroke-width:1.9; }

    .map-label-bg { fill:var(--background); fill-opacity:.96; }
    .map-label-text { paint-order:stroke; stroke:var(--background); stroke-width:4; stroke-linejoin:round; }
    .map-leader { stroke:#a7a4b7; stroke-width:.8; fill:none; stroke-opacity:.48; }
    .map-anchor { fill:var(--foreground); }
    .map-anchor.selected { fill:var(--viz-series-1); }
    .polar-grid { pointer-events:none; }

    .map-svg:not([data-renderer="perspective-flight"]) .polar-grid text { fill:#d4cce6; fill-opacity:.42; font-size:11px; }

    .map-detail { position:sticky; top:24px; padding:18px 17px; border-radius:16px; background:#2d2f3b; border:1px solid #41434f; min-width:0; }
    .map-detail-title { font-size:16px; font-weight:500; color:var(--viz-series-1); }
    .map-detail p { line-height:1.8; margin:12px 0; }
    .map-detail code { display:block; padding:9px 11px; background:#242632; border-radius:7px; overflow-wrap:anywhere; font-family:Consolas,monospace; font-size:12px; line-height:1.7; }
    .map-stats { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0; color:var(--muted-foreground); }
    .map-pair { display:flex; flex-wrap:wrap; gap:7px; margin:12px 0; }
    .map-pair>span { flex-basis:100%; color:var(--muted-foreground); font-size:12px; }
    .btn { font:inherit; font-size:12px; border:1px solid #4a4b59; background:#383a46; border-radius:9px; color:var(--foreground); padding:7px 10px; }
    .btn:hover { background:#42404e; border-color:#b985a7; }
    #am3-comparison { font-size:12px; line-height:1.8; color:#ded7e4; padding-top:4px; }
    details { margin-top:17px; font-size:12px; }
    summary { cursor:pointer; color:var(--muted-foreground); padding:4px 0; }
    .map-relation-list { display:grid; gap:10px; margin-top:12px; line-height:1.7; }
    .map-key-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px 12px; margin:10px 0 16px; }
    .map-key-grid button { text-align:left; }
    .map-key { font-size:12px; line-height:1.7; }
    .map-key[hidden],[hidden] { display:none!important; }
    .map-rotation { align-items:center; gap:8px 14px; padding:8px 0 5px; }
    .flight-help { flex:1 1 400px; font-size:12px; color:var(--muted-foreground); line-height:1.8; }
    kbd { color:#ded7e4; padding:2px 4px; background:#393b48; border-radius:4px; font-family:inherit; }
    #camera-status { font-size:12px; color:var(--muted-foreground); font-variant-numeric:tabular-nums; margin:8px 0 2px; }
    body[data-view="semantic3d"] .map-plot { height:min(74vh,820px); min-height:480px; background:#1c2331; border-radius:16px; overflow:hidden; border:1px solid #414654; }
    body[data-view="semantic3d"] .map-svg { height:100%; cursor:grab; }
    body[data-view="semantic3d"] .map-svg:active { cursor:grabbing; }
    footer { color:var(--muted-foreground); font-size:12px; margin-top:20px; line-height:1.7; }
    .text-small { font-size:12px; } .tabular-nums { font-variant-numeric:tabular-nums; }
    @media (max-width:1000px) { .workspace { grid-template-columns:1fr; } .map-detail { position:static; } }
    @media (max-width:600px) { main { padding:20px 14px; } h1 { font-size:21px; } .workspace { gap:15px; } .map-chapters { gap:6px 12px; } .form-select { font-size:16px; } .flight-help { flex-basis:100%; } }
  </style>
</head>

":"工具名称映射","chapter":"6","file":"06_local_tools.py","description":"用字典把工具名称 add、multiply 映射到本地 Python 函数。程序根据模型给出的名称查找允许的函数，未知名称必须处理，不执行任意字符串代码。","example":"tool_functions['add']","group":"工具","x":0.41075222873669354,"y":-0.5026372903743446},{"id":"arguments","name":"参数字典与取值","chapter":"6、7","file":"06_local_tools.py","description":"工具调用提供参数字典，例如 a=23、b=19。先明确读取 arguments['a'] 和 arguments['b']，再传给对应函数；检查缺失字段和错误类型。","example":"arguments = {'a':23, 'b':19}","group":"工具","x":-0.19497927068082924,"y":-0.29038929210179926},{"id":"execute","name":"本地执行工具函数","chapter":"6、8","file":"06_local_tools.py","description":"模型只提出工具名称和参数，Python 程序实际执行 add 或 multiply 并得到返回值。记录实际参数和执行结果，不能把模型的猜测当作已执行结果。","example":"result = function(a, b)","group":"工具","x":0.3411630060845405,"y":-0.2639015675014035},{"id":"schema","name":"工具说明与 schema","chapter":"7","file":"07_tool_request.py","description":"工具描述写明名称、用途及参数 JSON schema，包括参数类型和 required 字段。把 tools 随请求发送给模型，让模型知道可申请哪些工具以及参数格式。","example":"name、description、parameters","group":"工具","x":-0.1481511228075654,"y":0.32299565312958495},{"id":"call","name":"tool_calls 调用请求","chapter":"7、8","file":"07_tool_request.py","description":"完整助手消息的 tool_calls 列表包含每次工具调用的 id、function.name 和 JSON 字符串 arguments。程序保存整条助手调用消息，再按名称和解析后的参数执行工具。","example":"assistant['tool_calls'][0]","group":"工具","x":0.20362074813597245,"y":0.39647627116892287},{"id":"callid","name":"tool_call_id 关联","chapter":"8","file":"08_tool_result.py","description":"工具结果消息的 tool_call_id 必须等于对应助手工具调用的 id。这个标识将申请与结果配对；多次工具调用要分别返回结果，不能只填工具名称。","example":"tool_call_id = call['id']","group":"上下文","x":0.13923239509547417,"y":0.18703232900588884},{"id":"result","name":"工具结果消息与回传","chapter":"8","file":"08_tool_result.py","description":"将实际工具返回值转成字符串，创建 role='tool' 的消息，填写 tool_call_id 并追加到 messages。再次调用模型后，它才看到执行结果并能继续计算或形成最终回答。","example":"{'role':'tool', 'tool_call_id':id, 'content':str(result)}","group":"上下文","x":0.3917715880241885,"y":0.19901325715880006},{"id":"loop","name":"分支与重复请求","chapter"         const areaHeight=(maxY-minY)*scale;
        height=Math.max(compact?580:800,Math.ceil(areaHeight+margin*2+70));
        const originY=(height-areaHeight)/2;
        polarGeometry={x:margin-minX*scale,y:originY+maxY*scale,scale};
        for(const n of byId.values()){
          const x=margin+(n.x-minX)*scale,y=originY+(maxY-n.y)*scale;
          anchors.set(n.id,{x,y});
          const lines=compact?[n.code]:wrap(n.name,104);
          const w=compact?52:116,h=compact?44:lines.length*16+22;
          boxes.set(n.id,{x:x-w/2+10,y:y-h/2+10,w,h,lines});
        }
        // 只移动文字框避让；语义圆点保持原来的 MDS 坐标。
        const values=Array.from(boxes.values());
        for(let iter=0;iter<260;iter++){
          let changes=0;
          for(let i=0;i<values.length;i++)for(let j=i+1;j<values.length;j++){
            const a=values[i],b=values[j];if(!collision(a,b,6))continue;
            const dy=(a.y+a.h/2)-(b.y+b.h/2);
            const shift=(Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y)+6)/2;
            a.y+=dy>=0?shift:-shift;b.y+=dy>=0?-shift:shift;changes++;
          }
          for(const b of values){b.x=Math.max(5,Math.min(width-b.w-5,b.x));b.y=Math.max(35,Math.min(height-b.h-38,b.y));}
          if(!changes)break;
        }
      }
      svg.setAttribute('viewBox',`0 0 ${width} ${height}`);svg.setAttribute('height',height);svg.replaceChildren();
      S('title',{},'Agent 知识地图 V0.3：全部知识点和明确关系');
      S('desc',{},layout==='relations'?'文字框位置为人工阅读布局，不能用图上的距离比较语义。':'小圆点是 WeMM 向量的 MDS 投影坐标；文字框避让，用细线连接原坐标；二维投影存在失真。');
      const defs=S('defs');
      if(layout==='semantic')drawPolarGrid(polarGeometry,width,height,defs);
      const chapterFills=new Map();
      for(const n of byId.values()){
        const chapters=chaptersOf(n);
        if(chapters.length===1){chapterFills.set(n.id,softChapter(chapters[0]));continue;}
        const id='am3-chapters-'+n.id;
        const gradient=S('linearGradient',{id,x1:'0%',y1:'0%',x2:'100%',y2:'0%'},undefined,defs);
        S('stop',{offset:'0%','stop-color':softChapter(chapters[0])},undefined,gradient);
        S('stop',{offset:'50%','stop-color':softChapter(chapters[0])},undefined,gradient);
        S('stop',{offset:'50%','stop-color':softChapter(chapters[1])},undefined,gradient);
        S('stop',{offset:'100%','stop-color':softChapter(chapters[1])},undefined,gradient);
        chapterFills.set(n.id,'url(#'+id+')');
      }
      for(const active of [false,true]){const marker=S('marker',{id:'am3-arrow-'+Number(active),viewBox:'0 0 8 8',refX:7,refY:4,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'},undefined,defs);S('path',{d:'M1 1L7 4L1 7',fill:'none',stroke:active?'var(--viz-series-1)':'var(--muted-foreground)','stroke-width':1.3},undefined,marker);}
      S('text',{x:8,y:16},layout==='relations'?'全部关系 · 标签按阅读需要排布':'固定语义圆点 · 文字框避让');
      if(layout==='semantic'){
        S('text',{x:8,y:height-12,class:'axis-title','data-axis':'x'},'二维语义投影坐标 · 等比例显示');
        S('text',{x:8,y:32,class:'axis-title','data-axis':'y'},'位置旋转不改变距离');
      }
      const edgeGeometry=[];
      function rectPort(box,toward){const cx=box.x+box.w/2,cy=box.y+box.h/2,dx=toward.x-cx,dy=toward.y-cy;const scale=1/Math.max(Math.abs(dx)/(box.w/2),Math.abs(dy)/(box.h/2),0.001);return{x:cx+dx*scale,y:cy+dy*scale};}
      for(let k=0;k<edges.length;k++){
        const [a,b,label,type]=edges[k],aa=anchors.get(a),bb=anchors.get(b),active=a===selected||b===selected;
        let path,mid,points;
        if(layout==='relations'){
          const ab=boxes.get(a),bc=boxes.get(b);
          const source=rectPort(ab,bb),target=rectPort(bc,aa);
          if(Math.abs(ab.row-bc.row)<=1){const bend=(source.y+target.y)/2;path=`M${source.x} ${source.y}C${source.x} ${bend} ${target.x} ${bend} ${target.x} ${target.y}`;mid={x:(source.x+target.x)/2,y:bend};points=[source,mid,target];}
          else{
            const lane=(k%5-2)*4;
            const corridor=ab.col===bc.col?(ab.col<2?ab.x+ab.w+12+lane:ab.x-12+lane):(aa.x+bb.x)/2+lane;
            const sy=source.y+(target.y>=source.y?12:-12),ty=target.y+(target.y>=source.y?-12:12);
            path=`M${source.x} ${source.y}L${source.x} ${sy}L${corridor} ${sy}L${corridor} ${ty}L${target.x} ${ty}L${target.x} ${target.y}`;
            mid={x:corridor,y:(sy+ty)/2};points=[source,{x:corridor,y:sy},mid,{x:corridor,y:ty},target];
          }
        }else{
          const dx=bb.x-aa.x,dy=bb.y-aa.y,length=Math.max(1,Math.hypot(dx,dy));
          const end={x:bb.x-dx/length*7,y:bb.y-dy/length*7};
          path=`M${aa.x} ${aa.y}L${end.x} ${end.y}`;mid={x:(aa.x+bb.x)/2,y:(aa.y+bb.y)/2};points=[aa,mid,bb];
        }
        const p=S('path',{d:path,class:'map-edge'+(active?' active':'')+(type==='反馈'?' feedback':''),'marker-end':`url(#am3-arrow-${Number(active)})`,'data-edge':k});
        if(type==='对比')p.setAttribute('marker-start',`url(#am3-arrow-${Number(active)})`);
        p.setAttribute('data-tooltip',byId.get(a).name+' —'+label+'→ '+byId.get(b).name);
        edgeGeometry.push({k,label,type,mid,points,active});
      }
      if(layout==='semantic')for(const [id,b] of boxes){const a=anchors.get(id),p=rectPort(b,a);S('line',{x1:a.x,y1:a.y,x2:p.x,y2:p.y,class:'map-leader'});}
      const occupied=Array.from(boxes.values()).map(b=>({...b}));
      const labels=[];
      const sorted=edgeGeometry.slice().sort((a,b)=>Number(b.active)-Number(a.active));
      for(const edge of sorted){
        const content=compact?'R'+String(edge.k+1).padStart(2,'0'):edge.label;
        const w=textWidth(content)+8,h=18,candidates=[];
        for(const point of [edge.mid,...edge.points])for(const offset of [[0,0],[0,-16],[0,16],[24,0],[-24,0],[0,-32],[0,32],[36,-20],[-36,20]])candidates.push({x:point.x-w/2+offset[0],y:point.y-h/2+offset[1],w,h});
        // 留白区域的候选位置，只用于关系文字的避让，不会改变图中的知识坐标。
        for(let y=45;y<height-35;y+=22)for(let x=8;x<width-w-8;x+=24)candidates.push({x,y,w,h});
        const valid=candidates.filter(c=>c.x>=3&&c.x+c.w<=width-3&&c.y>=35&&c.y+c.h<=height-28&&!occupied.some(b=>collision(c,b,3)));
        valid.sort((a,b)=>Math.hypot(a.x+w/2-edge.mid.x,a.y+h/2-edge.mid.y)-Math.hypot(b.x+w/2-edge.mid.x,b.y+h/2-edge.mid.y));
        const chosen=valid[0];
        if(chosen){occupied.push(chosen);labels.push({...edge,...chosen,content});}
      }
      for(const l of labels){
        const g=S('g',{'data-edge-label':l.k,'data-tooltip':byId.get(edges[l.k][0]).name+' —'+l.label+'→ '+byId.get(edges[l.k][1]).name});
        if(Math.hypot(l.x+l.w/2-l.mid.x,l.y+l.h/2-l.mid.y)>32)S('line',{x1:l.mid.x,y1:l.mid.y,x2:l.x+l.w/2,y2:l.y+l.h/2,class:'map-leader',opacity:0.5},undefined,g);
        S('rect',{x:l.x,y:l.y,width:l.w,height:l.h,class:'map-label-bg'},undefined,g);
        S('text',{x:l.x+l.w/2,y:l.y+13,'text-anchor':'middle',class:'map-label-text'},l.content,g);
      }
      for(const [id,box] of boxes){
        const n=byId.get(id),g=S('g',{'data-node':id,class:'cursor-interaction','data-tooltip':n.code+' '+n.name+' · 第 '+n.chapter+' 章'});
        const nodeRect=S('rect',{x:box.x,y:box.y,width:box.w,height:box.h,rx:6,class:'map-node'+(id===selected?' selected':'')},undefined,g);
        nodeRect.setAttribute('style','fill:'+chapterFills.get(id));
        const lineTop=box.y+(compact?18:16);
        box.lines.forEach((line,i)=>S('text',{x:box.x+box.w/2,y:lineTop+i*16,'text-anchor':'middle'},line,g));
        S('text',{x:box.x+box.w/2,y:box.y+box.h-7,'text-anchor':'middle'},compact?'章 '+n.chapter:'第 '+n.chapter+' 章',g);
        g.addEventListener('click',()=>choose(id));
      }
      if(layout==='semantic')for(const [id,a] of anchors){
        const n=byId.get(id),chapters=chaptersOf(n);
        const fill=chapters.length===1?chapterColor(chapters[0]):chapterFills.get(id);
        S('circle',{cx:a.x,cy:a.y,r:id===selected?5:3.5,class:'map-anchor'+(id===selected?' selected':''),'data-anchor':id,style:'fill:'+fill,stroke:'var(--foreground)','stroke-width':0.7});
      }
      const legendText=layout==='relations'?'箭头文字＝明确用途 · 虚线＝结果反馈 · 粉线＝当前节点关联 · 位置用于阅读':'小圆点＝真实语义坐标 · 细线＝标签避让 · 粉线＝当前关联 · 二维距离相对误差 '+(projection.normalized_distance_error*100).toFixed(1)+'%';
      root.querySelector('#am3-legend').textContent=(compact?'N／R＝编号 · 全部文字见下方索引 · ':'')+legendText+(layout==='semantic'?' · 极坐标原点 (0,0)，每圈 0.2 投影单位':'');
      const key=root.querySelector('#am3-key');key.hidden=!compact;key.replaceChildren();
      if(compact){
        H('div','知识点编号','map-detail-title',key);const nodeGrid=H('div',undefined,'map-key-grid',key);
        for(const n of byId.values())H('div',n.code+' '+n.name,undefined,nodeGrid);
        H('div','关系编号','map-detail-title',key);const relationGrid=H('div',undefined,'map-relation-list',key);
        edges.forEach(([a,b,label],i)=>H('div','R'+String(i+1).padStart(2,'0')+' '+byId.get(a).code+' —'+label+'→ '+byId.get(b).code,undefined,relationGrid));
      }
      svg.setAttribute('data-node-count',boxes.size);svg.setAttribute('data-edge-count',edges.length);svg.setAttribute('data-label-count',labels.length);
    }

    function drawPolarGrid(origin,width,height,defs){
      const clip=S('clipPath',{id:'polar-clip'},undefined,defs);
      S('rect',{x:0,y:35,width,height:height-70},undefined,clip);
      const grid=S('g',{class:'polar-grid','clip-path':'url(#polar-clip)','aria-hidden':'true','data-polar-origin-x':origin.x,'data-polar-origin-y':origin.y,'data-polar-scale':origin.scale,'data-world-origin':'0,0'});
      const corners=[[0,35],[width,35],[0,height-35],[width,height-35]];
      const radius=Math.max(...corners.map(([x,y])=>Math.hypot(x-origin.x,y-origin.y)));
      for(let r=.2;r<=radius/origin.scale+.2;r+=.2){
        S('circle',{cx:origin.x,cy:origin.y,r:r*origin.scale,'data-polar-radius':r.toFixed(1)},undefined,grid);
        if(origin.x+r*origin.scale<width-26)S('text',{x:origin.x+r*origin.scale+4,y:origin.y-7},r.toFixed(1),grid);
      }
      for(let degrees=0;degrees<360;degrees+=30){
        const angle=degrees*Math.PI/180;
        S('line',{x1:origin.x,y1:origin.y,x2:origin.x+Math.cos(angle)*radius,y2:origin.y-Math.sin(angle)*radius,class:degrees%90===0?'polar-main':''},undefined,grid);
      }
      S('text',{x:origin.x+5,y:origin.y+14},'O',grid);
    }
    function ensureFlight(){
      if(!flight){
        const colors=Array.from({length:10},(_,i)=>getComputedStyle(root).getPropertyValue('--am3-chapter-'+(i+1)).trim());
        flight=new AgentMap3D({svg,plot,nodes:Array.from(byId.values()),edges,positions:data3d.nodes,colors,selected,onSelect:choose,onCamera:camera=>{
          const status=root.querySelector('#camera-status');
          const p=camera.position;
          status.textContent=`观察位置 (${p.map(v=>v.toFixed(2)).join(', ')}) · 视野内 ${camera.visibleCount} / ${camera.totalCount} 个知识点`;
          status.dataset.cameraX=p[0];status.dataset.cameraY=p[1];status.dataset.cameraZ=p[2];
          status.dataset.cameraYaw=camera.yaw;status.dataset.cameraPitch=camera.pitch;
        }});
      }
      return flight;
    }
    root.querySelector('#reset-camera').addEventListener('click',()=>ensureFlight().reset());
    for(const n of byId.values()){
      const button=H('button',n.code+' '+n.name,'btn',root.querySelector('#am3-all-nodes'));
      button.type='button';button.addEventListener('click',()=>choose(n.id));
    }

    function choose(id){if(!byId.has(id))return;selected=id;comparison=null;updateDetail();draw();persist();}
    nodeSelect.addEventListener('change',()=>choose(nodeSelect.value));
    layoutSelect.addEventListener('change',()=>{layout=layoutSelect.value;updateDetail();draw();persist();});
    new ResizeObserver(()=>draw()).observe(plot);
    updateDetail();draw();
  })();
  </script>
</main>
</body>
</html>
